# Crop disease AI configuration
# Standalone module. No flight-control settings here by design.

model:
  # Default deployment: cropguard urbane (static-int8 ResNet50) from Hugging
  # Face AbhiCommits/cropguard-models. ~99.1% test accuracy on a leaf-grouped
  # PlantVillage test split (8,125 images); 38 classes in the same order as
  # labels.txt. Measured on Raspberry Pi 4B: ~146 ms/inference (~6.8 FPS).
  #   source: https://huggingface.co/AbhiCommits/cropguard-models
  path: models/cropguard_int8.onnx
  labels: models/labels.txt
  #
  # Alternative: our own self-trained EfficientNetB0 export (imagenet
  # pretrained, 38-class). Uses divide_255 and is NOT normalization-compatible
  # with cropguard. Swap back to it with:
  #   path: models/disease_model.onnx
  #   preprocessing.type: divide_255
  # Expected architecture (from the reference repository's training code):
  #   EfficientNetB7(include_top=False) -> GlobalAveragePooling2D -> Dense(38, softmax)
  # input:  224x224x3 float32
  # output: 38-class probability vector
  input_size: [224, 224]
  expected_classes: 38

preprocessing:
  # cropguard ONNX (timm ResNet50 export) expects ImageNet-normalized input:
  #   imagenet    -> (x/255 - mean) / std
  #
  # divide_255  -> x / 255.0            (matches our Keras training pipeline)
  # none        -> raw 0-255 float32
  type: imagenet
  # Used only when type is imagenet
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

inference:
  # Backend must be onnx or mock. tflite is declared for future use only.
  backend: onnx
  # Results below this are reported as class_name "Unknown" with
  # reason "below_confidence_threshold" rather than forced to a disease.
  confidence_threshold: 0.70
  # Labels containing "healthy" (case-insensitive) set healthy=true.
  healthy_keyword: healthy
  # Fail loudly when label count != model output classes. Never guess.
  strict_label_count: true

tiled:
  # Sliding-window scan for wide/aerial frames: drones capture whole plants or
  # many leaves, and downscaling one such frame to 224x224 destroys the leaf
  # signal. When scanning is active, frames larger than tile_size are split
  # into tiles, each classified, and the best tile reported. Small/leaf-sized
  # frames always take the single-inference path.
  #
  # Overlap vs recall (measured, cropguard int8 on a real background leaf):
  #   leaf >= 75% of tile side -> reliable disease   (conf ~0.73+)
  #   leaf ~60%                -> Unknown (~0.59)
  #   leaf 15% (background dominant) -> classified as background crop/healthy
  # So a tile scan only works at close range, where a leaf fills ~2/3 of a
  # tile. A leaf straddling a tile seam is silently lost unless tiles overlap:
  # stride == tile_size -> complete gapless coverage, no overlap, seam-blind.
  # stride <  tile_size -> overlaps catch seam-boundary leaves, more CPU.
  # Raspberry Pi 4B (cropguard int8): a 640x480 frame -> ~9 tiles ~1.4 s at
  # stride 224, ~30 tiles ~4.6 s at stride 112 (one 112-overlap tile rescued
  # a seam-straddling leaf that stride 224 missed entirely).
  #
  # enabled: true makes /api/disease/analyze scan wide frames; the in-flight
  # monitor always scans regardless of this switch. True aerial-altitude
  # detection still needs a leaf-ROI stage in front of the classifier.
  enabled: false
  tile_size: 224
  stride: 224

camera:
  # OpenCV device index for a USB webcam. CSI cameras need picamera2 instead;
  # see src/camera.py for the abstraction.
  device: 0
  width: 640
  height: 480
  fps: 15

logging:
  enabled: false
  results_dir: logs/results
  images_dir: logs/images
  # Save the annotated frame alongside each result.
  save_annotated_images: false