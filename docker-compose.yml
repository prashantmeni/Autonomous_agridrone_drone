version: "3.9"
services:
  api:
    build: .
    image:agridrone:latest
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    restart: unless-stopped
    command: python -m drone.main --config config/production.yaml
