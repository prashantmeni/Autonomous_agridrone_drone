[project]
name = "autonomous-smart-farming-drone"
version = "0.1.0"
description = "Autonomous Smart Farming Drone - Raspberry Pi companion computer for PX4/Pixhawk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "pymavlink>=2.4",
  "numpy>=1.26",
  "shapely>=2.0",
  "pyserial>=3.5",
  "psutil>=5.9",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "structlog>=24.1",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27"]
pi = ["picamera2>=0.3", "tflite-runtime>=2.14"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
drone = "drone.cli.main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not hardware and not simulation'"
markers = [
  "hardware: requires physical hardware",
  "simulation: requires SITL",
]
